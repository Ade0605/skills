# Gitleaks settings for this repository: the default rules, plus a short list of known, safe matches.
title = "skills gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known safe matches"
regexTarget = "line"
regexes = [
  # Lasgidi's browser save slots (localStorage key names such as 'lasgidi.prefs.v1'), not secrets.
  "_KEY\\s*=\\s*['\"]lasgidi\\.[a-z0-9.]+['\"]",
]
paths = [
  # The website's public Supabase anon key (meant to be public: the database rules protect the data).
  '''^src/online-config\.js$''',
  # Vendored, minified third-party library (Supabase JS): minified code such as
  # 'fetchWithAuth=t.resolveHeadersConstructor=...' trips generic-api-key; it holds no secrets.
  # lasgidi/vendor/ on main; vendor/ at the root of the gh-pages branch (built from lasgidi/).
  '''^lasgidi/vendor/supabase\.js$''',
  '''^vendor/supabase\.js$''',
]
