# Publish the Lasgidi game (lasgidi/) to GitHub Pages: free hosting with HTTPS.
# The built site is pushed to the gh-pages branch. GitHub usually turns Pages on for that branch by itself; if the site
# 404s, set Settings → Pages → Build and deployment → Source: "Deploy from a branch", branch gh-pages, folder / (root).
# Optional custom domain (for example gidilife.app): set a repository variable LASGIDI_DOMAIN, then add the DNS records
# in lasgidi/docs/HOSTING.md. Runs on pushes to main that touch the game, or by hand from the Actions tab.
name: Lasgidi on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['lasgidi/**', '.github/workflows/lasgidi-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lasgidi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lasgidi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: "Assemble the site (the game only: no server, tests or previews)"
        run: |
          mkdir -p ../_site
          cp index.html manifest.webmanifest icon.svg sw.js ../_site/
          cp -r src vendor ../_site/
          if [ -d img ]; then cp -r img ../_site/; fi
          cp dist/lasgidi.html ../_site/play.html
          touch ../_site/.nojekyll
          if [ -n "${{ vars.LASGIDI_DOMAIN }}" ]; then echo "${{ vars.LASGIDI_DOMAIN }}" > ../_site/CNAME; fi
          # Online features (optional): your Supabase project's URL and public anon key, from repository variables.
          if [ -n "${{ vars.LASGIDI_SUPABASE_URL }}" ] && [ -n "${{ vars.LASGIDI_SUPABASE_ANON }}" ]; then
            printf 'window.LASGIDI_ONLINE = { url: %s, anon: %s };\n' "$(node -e 'console.log(JSON.stringify(process.argv[1]))' "${{ vars.LASGIDI_SUPABASE_URL }}")" "$(node -e 'console.log(JSON.stringify(process.argv[1]))' "${{ vars.LASGIDI_SUPABASE_ANON }}")" > ../_site/src/online-config.js
          fi
      - name: Shrink the scripts (same safe minify as the single-file build)
        working-directory: lasgidi
        run: node tools/minify-site.js ../_site
      - name: Publish to the gh-pages branch
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Lasgidi from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
